name: CI/CD

# Software Design Report §3.4: every push and pull request runs ruff and pytest (with coverage);
# only a green build on main triggers the Render deploy hook.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install "ruff>=0.6"
      - run: ruff check --output-format=github .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL 16 so the database tests (tests/db) run in CI instead of being skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campusevent
          POSTGRES_PASSWORD: campusevent-ci
          POSTGRES_DB: campusevent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campusevent"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Only a CI test database with a CI-only password, not a secret.
      TEST_DATABASE_URL: postgresql://campusevent:campusevent-ci@localhost:5432/campusevent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Coverage settings (source, branch coverage) are in pyproject.toml; see docs/tests/coverage.
      - run: >-
          python -m pytest -q --junitxml=pytest-report.xml
          --cov --cov-report=term --cov-report=xml --cov-report=html
      - name: Coverage summary
        if: always()
        run: |
          echo "## Code coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            pytest-report.xml
            coverage.xml
            htmlcov/

  deploy:
    name: Deploy to Render
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set yet; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
