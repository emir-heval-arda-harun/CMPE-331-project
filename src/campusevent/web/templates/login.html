{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card p-4">
      <h1 class="h4 mb-3">Log in</h1>
      {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
      {% if unverified_email %}
      <p class="small"><a href="{{ url_for('auth.verify_form') }}">Enter your verification code</a></p>
      {% endif %}
      <form method="post" action="{{ url_for('auth.login') }}" novalidate>
        {{ csrf() }}
        <div class="mb-3">
          <label class="form-label" for="email">E-mail</label>
          <input class="form-control" id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary w-100" type="submit">Log in</button>
      </form>
      <p class="mt-3 mb-0 small">No account yet? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
    </div>
  </div>
</div>
{% endblock %}
