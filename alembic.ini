# Alembic configuration (database migrations). See docs/database/README.md.
#
# The database address is NOT written here: migrations/env.py reads DATABASE_URL from the
# environment or from your local .env file.

[alembic]
script_location = %(here)s/migrations
# Lets migrations/env.py import the campusevent package from src/.
prepend_sys_path = %(here)s/src
path_separator = os
# File names like 20261118_0001_initial_schema.py, sorted by date.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
