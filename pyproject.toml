[project]
name = "campusevent"
version = "0.1.0"
description = "Social sports-matching platform for university students"
requires-python = ">=3.11"  # SQLAlchemy 2.1 needs 3.11+; CI and Render use 3.12

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
# Errors only (syntax, undefined names, unused imports); style is not enforced in CI.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["campusevent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
